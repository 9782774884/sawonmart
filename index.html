<!doctype html>
<html lang="hi-Latn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2874f0" />

    <title>SawonMart – Online Shopping for Electronics, Fashion, Home &amp; More</title>
    <meta
      name="description"
      content="SawonMart par khojein mobiles, laptops, fashion, beauty, home appliances aur groceries. Best deals, fast delivery aur 100% authentic products."
    />
    <meta name="author" content="SawonMart" />

    <!-- First-paint canonical, and the host the build-time sitemap is written
         against. Keep in step with the ORIGIN default in
         scripts/generate-sitemap.mjs, which fails the build if the two disagree.

         www.sawonstore.in is the intended production domain but is not
         registered yet, so the fallback host is used until it is.
         useDocumentMeta() rewrites these per route at runtime, honouring
         whichever recognised host actually served the page. -->
    <link rel="canonical" href="https://sawonstore-b.web.app/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SawonMart" />
    <meta property="og:title" content="SawonMart – Online Shopping for Everything" />
    <meta
      property="og:description"
      content="Mobiles, fashion, home, beauty aur groceries – sab kuch best price par."
    />
    <meta property="og:locale" content="hi_IN" />
    <meta property="og:url" content="https://sawonstore-b.web.app/" />
    <meta
      property="og:image"
      content="https://sawonstore-b.web.app/assets/images/banners/hero-1.svg"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SawonMart – Online Shopping for Everything" />
    <meta
      name="twitter:image"
      content="https://sawonstore-b.web.app/assets/images/banners/hero-1.svg"
    />


    <link rel="icon" type="image/svg+xml" href="/assets/images/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/images/brand/logo-mark.svg" />
  </head>

  <body>
    <!-- No skip link here on purpose: both the storefront <Layout> and the admin
         <AdminLayout> render their own, targeting their own #main-content /
         #admin-main. A static one in this file would duplicate them and point
         at an id that does not exist on the admin route. -->

    <div id="root"></div>

    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: system-ui, sans-serif">
        <h1>JavaScript band hai</h1>
        <p>SawonMart chalane ke liye kripya JavaScript enable karein.</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
